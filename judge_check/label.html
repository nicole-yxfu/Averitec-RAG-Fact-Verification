<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge Check Labelling</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #fff; --surface-2: #f0f0ec; --border: #e2e1dc;
  --text: #1d1d1b; --muted: #6b6a64; --faint: #9a9890; --accent: #3355cc; --accent-soft: #e8edfb;
  --yes: #1f7a4d; --yes-bg: #e3f3ea; --no: #b3261e; --no-bg: #fbe7e5; --maybe: #9a5b00; --maybe-bg: #fdf0d9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #262624; --border: #33332f;
    --text: #ecebe6; --muted: #a8a69e; --faint: #77756e; --accent: #8ea6ff; --accent-soft: #232b45;
    --yes: #6fd19e; --yes-bg: #17301f; --no: #ff8a80; --no-bg: #3a1b18; --maybe: #f4b860; --maybe-bg: #36290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1d1d1b; --surface-2: #262624; --border: #33332f;
  --text: #ecebe6; --muted: #a8a69e; --faint: #77756e; --accent: #8ea6ff; --accent-soft: #232b45;
  --yes: #6fd19e; --yes-bg: #17301f; --no: #ff8a80; --no-bg: #3a1b18; --maybe: #f4b860; --maybe-bg: #36290f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", Roboto, Arial, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-top: 14px; }
h1 { font-size: 24px; margin: 4px 0 8px; }
h2 { font-size: 16px; margin: 0 0 10px; }
.zh { color: var(--muted); font-size: 14px; }
.muted { color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { flex: 1 1 200px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.count { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); white-space: nowrap; }
.claim { font-size: 19px; font-weight: 650; line-height: 1.4; margin: 6px 0 0; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.ev { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; }
.ev li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ev .i { color: var(--faint); font-size: 13px; }
.ev .t { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.ev .d { font-size: 12px; color: var(--muted); margin-left: 6px; }
.ev .s { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.verdict { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; margin-top: 8px; }
.rule { margin-top: 12px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 10px 10px 0; font-size: 14px; }
.q { font-weight: 650; font-size: 16px; margin: 0 0 4px; }
.answers { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 600px) { .answers { grid-template-columns: 1fr; } }
.ans { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 12px 10px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-weight: 650; }
.ans small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.ans kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 6px; color: var(--muted); }
.ans:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ans.yes[aria-pressed="true"] { border-color: var(--yes); background: var(--yes-bg); color: var(--yes); }
.ans.no[aria-pressed="true"] { border-color: var(--no); background: var(--no-bg); color: var(--no); }
.ans.maybe[aria-pressed="true"] { border-color: var(--maybe); background: var(--maybe-bg); color: var(--maybe); }
textarea { width: 100%; margin-top: 12px; min-height: 44px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; resize: vertical; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.btn { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 650; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .4; cursor: default; }
details { margin-top: 10px; font-size: 14px; }
details li { margin: 3px 0; }
.ok { color: var(--yes); font-weight: 650; }
code { font: 13px ui-monospace, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="items.js"></script>
<script>
(function () {
  const ITEMS = window.ITEMS;
  const KEY = "judge_check_v1";
  const RULES_ALL = [
    ["Supported", "the evidence clearly supports the claim.", "资料明确支持这个说法"],
    ["Refuted", "the evidence clearly contradicts the claim.", "资料明确反驳这个说法"],
    ["Not enough evidence", "the evidence is insufficient, irrelevant, or absent.", "资料不够、无关或没有"],
    ["Conflicting evidence", "the evidence both supports and contradicts.", "资料既有支持也有反驳"],
  ];
  const ZH = Object.fromEntries(RULES_ALL.map(r => [r[0], r[2]]));
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let state = { answers: {}, pos: 0, started: false };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) state = s; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const nDone = () => ITEMS.filter(it => state.answers[it.id] && state.answers[it.id].answer).length;
  let shownAt = Date.now();

  const app = document.getElementById("app");

  function intro() {
    app.innerHTML = `
      <div class="label">Faithfulness judge check</div>
      <h1>Is the verdict justified by the evidence?</h1>
      <p class="zh">检查 AI 裁判准不准：50 个例子，大约 1 小时。可以随时关掉，进度会自动保存，下次打开接着做。</p>
      <div class="card">
        <h2>What you do <span class="zh">· 你要做什么</span></h2>
        <p>For each example you see a <b>claim</b>, the <b>evidence</b> the system found, and the system's <b>verdict</b>. Decide: <b>given only this evidence</b>, is the verdict justified?</p>
        <p class="zh">每个例子会显示一个说法、系统找到的资料、系统的结论。你判断：<b>只看这些资料</b>，这个结论站得住吗？</p>
        <p><b>Not</b> whether the claim is true in the real world. Ignore what you know; judge only what the evidence shows.</p>
        <p class="zh">不是判断这个说法在现实中真不真。不要用你自己知道的事，只看资料里写了什么。</p>
        <h2 style="margin-top:16px">The rules <span class="zh">· 规则（和 AI 裁判完全一样）</span></h2>
        <p class="muted" style="margin:0 0 6px">A verdict is justified when:</p>
        <ul>${RULES_ALL.map(r => `<li><b>${r[0]}</b>: ${r[1]} <span class="zh">· ${r[2]}</span></li>`).join("")}</ul>
        <p class="muted">Keyboard: <code>1</code> justified · <code>2</code> not justified · <code>3</code> can't tell · <code>←</code> <code>→</code> move.</p>
        <p class="zh">快捷键：1 站得住 · 2 站不住 · 3 判断不了 · 左右方向键切换。拿不准时可以写一句备注（中文就行）。</p>
      </div>
      <div class="nav"><span class="muted">${nDone()} / ${ITEMS.length} done</span>
        <button class="btn primary" id="go">${nDone() ? "Continue" : "Start"} →</button></div>`;
    document.getElementById("go").onclick = () => { state.started = true; save(); item(firstOpen()); };
  }

  function firstOpen() {
    const i = ITEMS.findIndex(it => !(state.answers[it.id] && state.answers[it.id].answer));
    return i === -1 ? ITEMS.length - 1 : i;
  }

  function item(i) {
    state.pos = i; save();
    const it = ITEMS[i];
    const a = state.answers[it.id] || {};
    shownAt = Date.now();
    app.innerHTML = `
      <div class="top">
        <div class="progress" aria-hidden="true"><span style="width:${nDone() / ITEMS.length * 100}%"></span></div>
        <span class="count">${i + 1} of ${ITEMS.length} · ${nDone()} done</span>
      </div>
      <div class="card">
        <div class="label">Claim · 说法</div>
        <p class="claim">${esc(it.claim)}</p>
      </div>
      <div class="card">
        <div class="label">Evidence the system found · 系统找到的资料</div>
        <ol class="ev">${it.evidence.map((e, j) => `
          <li><span class="i">${j + 1}</span><div>
            <span class="t">${esc(e.title || e.domain)}</span><span class="d">${esc(e.domain)}</span>
            <div class="s">${esc(e.snippet)}</div></div></li>`).join("")}
        </ol>
      </div>
      <div class="card">
        <div class="label">System verdict · 系统的结论</div>
        <div class="verdict">${esc(it.verdict)}</div>
        <div class="rule">Justified only if <b>${esc(it.rule)}</b><br><span class="zh">站得住的条件：${esc(ZH[it.verdict])}</span></div>
        <details><summary class="muted">All four rules · 全部规则</summary><ul>${RULES_ALL.map(r => `<li><b>${r[0]}</b>: ${r[1]} <span class="zh">· ${r[2]}</span></li>`).join("")}</ul></details>
      </div>
      <div class="card">
        <p class="q">Given only this evidence, is the verdict justified?</p>
        <div class="zh">只看上面的资料，这个结论站得住吗？</div>
        <div class="answers">
          <button class="ans yes" data-a="faithful" aria-pressed="${a.answer === "faithful"}">Justified<kbd>1</kbd><small>站得住</small></button>
          <button class="ans no" data-a="unfaithful" aria-pressed="${a.answer === "unfaithful"}">Not justified<kbd>2</kbd><small>站不住</small></button>
          <button class="ans maybe" data-a="unsure" aria-pressed="${a.answer === "unsure"}">Can't tell<kbd>3</kbd><small>判断不了</small></button>
        </div>
        <textarea id="note" placeholder="Optional note · 可选备注（拿不准时写一句）">${esc(a.note || "")}</textarea>
      </div>
      <div class="nav">
        <button class="btn" id="prev" ${i === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="home">Instructions</button>
        <button class="btn primary" id="next">${i === ITEMS.length - 1 ? "Finish" : "Next →"}</button>
      </div>`;
    app.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(i, b.dataset.a));
    document.getElementById("note").oninput = ev => {
      state.answers[it.id] = Object.assign(state.answers[it.id] || {}, { note: ev.target.value }); save();
    };
    document.getElementById("prev").onclick = () => i > 0 && item(i - 1);
    document.getElementById("next").onclick = () => i === ITEMS.length - 1 ? done() : item(i + 1);
    document.getElementById("home").onclick = intro;
    window.scrollTo(0, 0);
  }

  function answer(i, val) {
    const it = ITEMS[i];
    const prev = state.answers[it.id] || {};
    const secs = Math.round((Date.now() - shownAt) / 1000);
    state.answers[it.id] = Object.assign(prev, { answer: val, seconds: (prev.seconds || 0) + secs });
    save();
    // advance after a short beat so the choice is visible
    app.querySelectorAll(".ans").forEach(b => b.setAttribute("aria-pressed", b.dataset.a === val));
    setTimeout(() => (i === ITEMS.length - 1 ? done() : item(i + 1)), 220);
  }

  function exportText() {
    return JSON.stringify({ version: 1, exported: new Date().toISOString(), answers: state.answers }, null, 1);
  }

  function done() {
    const missing = ITEMS.filter(it => !(state.answers[it.id] && state.answers[it.id].answer)).map(it => it.n);
    app.innerHTML = `
      <h1>${missing.length ? "Almost there" : "All done — thank you!"}</h1>
      <p class="zh">${missing.length ? `还有 ${missing.length} 个没回答：第 ${missing.join("、")} 个。` : "全部完成！把答案交给 Claude 就行。"}</p>
      <div class="card">
        <h2>Send your answers <span class="zh">· 交答案</span></h2>
        <p class="zh">两种方法任选一种：<br>① 点「Download」，会下载一个 <code>judge_check_answers.json</code> 文件到「下载」文件夹，然后告诉 Claude「标完了」。<br>② 点「Copy」，然后直接粘贴到和 Claude 的对话里。</p>
        <div class="nav" style="justify-content:flex-start">
          <button class="btn primary" id="dl">Download</button>
          <button class="btn" id="cp">Copy</button>
          <span id="msg" class="ok"></span>
        </div>
      </div>
      <div class="nav"><button class="btn" id="back">← Back to the examples</button></div>`;
    document.getElementById("dl").onclick = () => {
      const blob = new Blob([exportText()], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "judge_check_answers.json";
      document.body.appendChild(a); a.click(); a.remove();
      document.getElementById("msg").textContent = "Downloaded · 已下载";
    };
    document.getElementById("cp").onclick = async () => {
      try { await navigator.clipboard.writeText(exportText()); document.getElementById("msg").textContent = "Copied · 已复制"; }
      catch (e) { document.getElementById("msg").textContent = "Copy failed — use Download · 复制失败，请用下载"; }
    };
    document.getElementById("back").onclick = () => item(missing.length ? missing[0] - 1 : 0);
  }

  document.addEventListener("keydown", ev => {
    if (ev.target.tagName === "TEXTAREA" || !app.querySelector(".ans")) return;
    const i = state.pos;
    if (ev.key === "1") answer(i, "faithful");
    else if (ev.key === "2") answer(i, "unfaithful");
    else if (ev.key === "3") answer(i, "unsure");
    else if (ev.key === "ArrowRight" && i < ITEMS.length - 1) item(i + 1);
    else if (ev.key === "ArrowLeft" && i > 0) item(i - 1);
  });

  state.started ? item(Math.min(state.pos, ITEMS.length - 1)) : intro();
})();
</script>
</body>
</html>
